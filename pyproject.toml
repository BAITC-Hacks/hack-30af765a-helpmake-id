[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'templ'
version = '0.1.0'
requires-python = '>=3.12'
dependencies = [
    'fastapi>=0.115',
    'uvicorn[standard]>=0.32',
    'pydantic[email]>=2.10',
    'pydantic-settings>=2.7',
    'sqlalchemy[asyncio]>=2.0',
    'asyncpg>=0.30',
    'alembic>=1.14',
    'PyJWT>=2.10',
    'bcrypt>=4.0',
    'httpx>=0.28',
    'python-multipart>=0.0.20',
]

[project.optional-dependencies]
dev = [
    'pytest>=8',
    'pytest-asyncio>=0.24',
    'anyio[trio]>=4',
    'coverage[toml]>=7',
    'pytest-cov>=6',
    'ruff>=0.8',
]

[tool.hatch.build.targets.wheel]
packages = ['src']

[tool.ruff]
line-length = 95
target-version = 'py312'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'UP', 'B', 'SIM']
ignore = ['E501']

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = 'auto'
pythonpath = ['.']
testpaths = ['tests']
addopts = '--cov=src --cov-report=term-missing'

[tool.coverage.run]
source = ['src']
omit = [
    'src/migrations/*',
    'src/ai/__init__.py',
]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    'pragma: no cover',
    'if TYPE_CHECKING:',
    '@abc.abstractmethod',
    'raise NotImplementedError',
]
