services:
  postgres:
    profiles: ['persistence']
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: templ
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-https://helpmake-id.live,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_KEY_1: ${AI_API_KEY_1:-}
      AI_API_KEY_2: ${AI_API_KEY_2:-}
      AI_API_KEY_3: ${AI_API_KEY_3:-}
      AI_MODEL: ${AI_MODEL:-}
      SCENARIO_DB_PATH: /var/lib/akim/scenarios.sqlite3
    volumes:
      - scenarios_data:/var/lib/akim
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  scenarios_data:
