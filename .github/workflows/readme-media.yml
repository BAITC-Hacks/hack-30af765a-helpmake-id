name: README media — live capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/readme-media.yml
      - .github/scripts/capture-readme-media.py

permissions:
  contents: write

concurrency:
  group: readme-media
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install capture tools
        run: |
          python -m pip install 'playwright==1.55.0' 'Pillow==11.3.0'
          python -m playwright install --with-deps chromium
      - name: Capture real UI and prepare README sections
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/capture-readme-media.py')
          source = p.read_text(encoding='utf-8')
          source = source.replace("page.locator('.quarter-buttons button').filter(has_text=re.compile('^Q' + str(q) + r'\\b'))", "page.locator('.quarter-buttons button').nth(q)")
          p.write_text(source, encoding='utf-8')
          PY
          python .github/scripts/capture-readme-media.py
      - name: Preserve media for inspection
        uses: actions/upload-artifact@v4
        with:
          name: akim-readme-media
          path: docs/media/
          if-no-files-found: error
          retention-days: 14
      - name: Publish only README and its media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/media/ .github/scripts/capture-readme-media.py
          if git diff --cached --quiet; then
            echo 'No media changes to publish.'
            exit 0
          fi
          git commit -m 'docs: add real UI screenshots and separate demo GIFs to README'
          git pull --rebase origin main
          git push origin HEAD:main
