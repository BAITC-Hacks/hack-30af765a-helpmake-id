name: Verify AI provider key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Test each key with a small chat completion
        shell: bash
        env:
          AI_API_URL: ${{ vars.AI_API_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_KEY_1: ${{ secrets.AI_API_KEY_1 }}
          AI_API_KEY_2: ${{ secrets.AI_API_KEY_2 }}
          AI_API_KEY_3: ${{ secrets.AI_API_KEY_3 }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          url = os.getenv('AI_API_URL')
          model = os.getenv('AI_MODEL')
          parsed = urllib.parse.urlparse(url or '')
          is_openai = url == 'https://api.openai.com/v1/chat/completions'
          is_azure = (
              parsed.scheme == 'https'
              and parsed.hostname is not None
              and parsed.hostname.endswith(('.openai.azure.com', '.services.ai.azure.com'))
              and parsed.path == '/openai/v1/chat/completions'
              and not any((parsed.params, parsed.query, parsed.fragment, parsed.username))
          )
          if not (is_openai or is_azure) or not model:
              print('Set AI_API_URL to a supported chat-completions endpoint and set AI_MODEL.')
              sys.exit(1)

          body = json.dumps({
              'model': model,
              'temperature': 0,
              'max_completion_tokens': 32,
              'messages': [
                  {'role': 'system', 'content': 'Reply briefly.'},
                  {'role': 'user', 'content': 'Say OK.'},
              ],
          }).encode()
          numbered = [
              (f'AI_API_KEY_{index}', os.getenv(f'AI_API_KEY_{index}'))
              for index in range(1, 4)
              if os.getenv(f'AI_API_KEY_{index}')
          ]
          keys = numbered or [('AI_API_KEY', os.getenv('AI_API_KEY'))]
          if not keys[0][1]:
              print('Set AI_API_KEY or at least one numbered AI_API_KEY secret.')
              sys.exit(1)
          failed = False
          for name, key in keys:
              request = urllib.request.Request(
                  url,
                  data=body,
                  headers={
                      'Authorization': f'Bearer {key}',
                      'Content-Type': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
                      ready = bool(payload.get('choices'))
                      print(f'{name}: {"chat ready" if ready else "unexpected response"}')
                      failed |= not ready
              except urllib.error.HTTPError as error:
                  try:
                      code = json.load(error).get('error', {}).get('code')
                  except (ValueError, AttributeError):
                      code = None
                  safe_code = code if isinstance(code, str) and re.fullmatch(r'[a-z_]+', code) else None
                  suffix = f' ({safe_code})' if safe_code else ''
                  print(f'{name}: HTTP {error.code}{suffix}')
                  failed = True
              except (urllib.error.URLError, TimeoutError):
                  print(f'{name}: network error')
                  failed = True
          sys.exit(1 if failed else 0)
          PY
