name: Backend CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+asyncpg://akim:ci-local-only@127.0.0.1:5432/akim
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: akim
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: akim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U akim -d akim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Lint and format check
        working-directory: backend
        run: make check
      - name: Apply PostgreSQL migrations
        working-directory: backend
        run: make migrate
      - name: Tests and coverage
        working-directory: backend
        run: make test
      - name: Build deployment image
        run: docker build -t "akim-backend:${GITHUB_SHA}" backend
      - name: Save image for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker save "akim-backend:${GITHUB_SHA}" | gzip > "${RUNNER_TEMP}/backend-image.tar.gz"
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: backend-image
          path: ${{ runner.temp }}/backend-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: backend-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Check that this is still the latest main commit
        id: latest
        run: |
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$latest_sha" ]; then
            echo 'Could not read the latest main commit.' >&2
            exit 1
          fi
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded commit $GITHUB_SHA."
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.latest.outputs.deploy == 'true'
        with:
          name: backend-image
          path: ${{ runner.temp }}
      - name: Deploy to backend-hr
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          AI_API_URL: ${{ vars.AI_API_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_KEY_1: ${{ secrets.AI_API_KEY_1 }}
          AI_API_KEY_2: ${{ secrets.AI_API_KEY_2 }}
          AI_API_KEY_3: ${{ secrets.AI_API_KEY_3 }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo 'Set DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS in GitHub Actions secrets.' >&2
            exit 1
          fi
          umask 077
          key_file="${RUNNER_TEMP}/deploy_key"
          hosts_file="${RUNNER_TEMP}/known_hosts"
          env_file="${RUNNER_TEMP}/deploy.env"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          ssh-keygen -F 20.124.93.89 -f "$hosts_file" > /dev/null
          if [ -n "$DEPLOY_ENV_FILE" ]; then
            printf '%s\n' "$DEPLOY_ENV_FILE" > "$env_file"
          else
            printf 'CORS_ORIGINS=https://helpmake-id.live\n' > "$env_file"
          fi
          for name in AI_API_URL AI_MODEL AI_API_KEY AI_API_KEY_1 AI_API_KEY_2 AI_API_KEY_3 DATABASE_URL; do
            value="${!name}"
            if [ -n "$value" ]; then
              if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
                echo "$name must be a single line." >&2
                exit 1
              fi
              printf '%s=%s\n' "$name" "$value" >> "$env_file"
            fi
          done
          target='useradmin@20.124.93.89'
          ssh_options=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts_file")
          ssh "${ssh_options[@]}" "$target" 'install -d -m 700 "$HOME/akim-ai-backend"'
          scp "${ssh_options[@]}" "${RUNNER_TEMP}/backend-image.tar.gz" "$env_file" deploy/deploy.sh "$target:akim-ai-backend/"
          ssh "${ssh_options[@]}" "$target" "chmod 600 \"\$HOME/akim-ai-backend/deploy.env\" && bash \"\$HOME/akim-ai-backend/deploy.sh\" $GITHUB_SHA"
