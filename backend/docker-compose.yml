services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: akim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: akim
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U akim -d akim']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    image: akim-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://akim:${POSTGRES_PASSWORD}@postgres:5432/akim
    command: ['alembic', 'upgrade', 'head']
    restart: 'no'

  backend:
    image: akim-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql+asyncpg://akim:${POSTGRES_PASSWORD}@postgres:5432/akim
      CORS_ORIGINS: ${CORS_ORIGINS:-https://helpmake-id.live,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_KEY_1: ${AI_API_KEY_1:-}
      AI_API_KEY_2: ${AI_API_KEY_2:-}
      AI_API_KEY_3: ${AI_API_KEY_3:-}
      AI_MODEL: ${AI_MODEL:-}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
